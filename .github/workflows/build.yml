name: Frontend CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, Test, and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: relaydock-frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
